<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kelola Data Pemilih - OSIS SMAN 1 Ngawi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse untuk membaca file CSV (Excel) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-6 font-sans">

    <div class="bg-white rounded-2xl shadow-xl w-full max-w-4xl border border-slate-200 overflow-hidden flex flex-col md:flex-row">
        
        <!-- BAGIAN KIRI: UPLOAD MASSAL (CSV) -->
        <div class="p-8 md:w-1/2 bg-white border-b md:border-b-0 md:border-r border-slate-100">
            <div class="mb-6 flex items-center gap-3">
                <div class="p-3 bg-blue-100 text-blue-600 rounded-xl">
                    <i class="ph-fill ph-file-csv text-2xl"></i>
                </div>
                <div>
                    <h2 class="text-xl font-bold text-slate-800">Upload Massal</h2>
                    <p class="text-slate-500 text-xs mt-1">Masukkan banyak data sekaligus via Excel/CSV.</p>
                </div>
            </div>

            <div class="bg-blue-50 p-4 rounded-xl mb-6 text-xs text-blue-800 border border-blue-100">
                <strong>Format Header CSV (Baris 1):</strong><br>
                <code class="font-bold bg-blue-100 px-1 py-0.5 rounded">nisn, nama, role</code>
            </div>

            <input type="file" id="csv-file" accept=".csv" class="block w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-bold file:bg-blue-600 file:text-white hover:file:bg-blue-700 transition-all mb-6 cursor-pointer border border-slate-200 rounded-xl p-2 bg-slate-50">

            <button id="btn-upload" class="w-full py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-md transition-all disabled:opacity-50 disabled:cursor-not-allowed flex justify-center items-center gap-2">
                <i class="ph-bold ph-upload-simple text-lg"></i>
                Mulai Upload Massal
            </button>

            <!-- Area Status Upload Massal -->
            <div id="status-area" class="mt-6 hidden">
                <div class="flex justify-between text-xs font-bold text-slate-700 mb-2">
                    <span>Proses Upload:</span>
                    <span id="progress-text">0 / 0</span>
                </div>
                <div class="w-full bg-slate-200 rounded-full h-2.5 overflow-hidden">
                    <div id="progress-bar" class="bg-blue-500 h-2.5 w-0 transition-all duration-300"></div>
                </div>
                <p id="log-message" class="text-xs text-center text-slate-500 mt-3"></p>
            </div>
        </div>

        <!-- BAGIAN KANAN: TAMBAH / EDIT MANUAL -->
        <div class="p-8 md:w-1/2 bg-slate-50">
            <div class="mb-6 flex items-center gap-3">
                <div class="p-3 bg-green-100 text-green-600 rounded-xl">
                    <i class="ph-fill ph-user-plus text-2xl"></i>
                </div>
                <div>
                    <h2 class="text-xl font-bold text-slate-800">Tambah / Edit Manual</h2>
                    <p class="text-slate-500 text-xs mt-1">Gunakan untuk data susulan atau perbaikan nama.</p>
                </div>
            </div>

            <form id="form-manual" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">NISN / NIP (ID Pemilih)</label>
                    <input type="text" id="manual-id" required class="w-full p-2.5 text-sm bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-green-500 outline-none" placeholder="Contoh: 1234567890">
                    <p class="text-[10px] text-slate-400 mt-1">*Jika NISN sudah ada, sistem akan mengubah datanya.</p>
                </div>
                
                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Nama Lengkap</label>
                    <input type="text" id="manual-name" required class="w-full p-2.5 text-sm bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-green-500 outline-none uppercase" placeholder="Masukkan nama...">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-700 mb-1">Sebagai (Role)</label>
                    <select id="manual-role" class="w-full p-2.5 text-sm bg-white border border-slate-200 rounded-lg focus:ring-2 focus:ring-green-500 outline-none">
                        <option value="Siswa">Siswa</option>
                        <option value="Guru">Guru/Staf</option>
                    </select>
                </div>

                <div class="pt-2">
                    <button type="submit" id="btn-manual-submit" class="w-full py-3 px-4 bg-green-600 hover:bg-green-700 text-white font-bold rounded-xl shadow-md transition-all flex justify-center items-center gap-2">
                        <i class="ph-bold ph-floppy-disk text-lg"></i>
                        Simpan Data Pemilih
                    </button>
                </div>
            </form>

            <div id="manual-alert" class="mt-4 hidden p-3 rounded-lg text-xs font-bold text-center transition-all">
                Pesan Notifikasi
            </div>
        </div>

    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // =====================================================================
        // ⚠️ PENTING: GANTI DENGAN KUNCI FIREBASE (CONFIG) MILIK ANDA!
        // =====================================================================
        const firebaseConfig = {
            apiKey: "AIzaSyCzeg9t7CjeoxNB9DaNK10NsHixk0LC9UA",
            authDomain: "e-voting-6f923.firebaseapp.com",
            projectId: "e-voting-6f923",
            storageBucket: "e-voting-6f923.firebasestorage.app",
            messagingSenderId: "626153070106",
            appId: "1:626153070106:web:309766b2c60f3a01a9fba3"
        };
        // =====================================================================

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const appId = 'osis-sman1ngawi-app'; // Prefix database SAMA PERSIS dengan aplikasi utama

        // Pastikan kita login secara anonim agar diizinkan Security Rules
        signInAnonymously(auth).catch(err => console.error("Gagal login anonim:", err));

        // --- ELEMEN DOM UPLOAD MASSAL ---
        const btnUpload = document.getElementById('btn-upload');
        const fileInput = document.getElementById('csv-file');
        const statusArea = document.getElementById('status-area');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        const logMessage = document.getElementById('log-message');

        // --- LOGIKA UPLOAD MASSAL ---
        btnUpload.addEventListener('click', async () => {
            const file = fileInput.files[0];
            if (!file) return alert("Silakan pilih file CSV terlebih dahulu!");

            btnUpload.disabled = true;
            fileInput.disabled = true;
            statusArea.classList.remove('hidden');
            logMessage.textContent = "Membaca file CSV...";
            logMessage.className = "text-xs text-center text-blue-500 mt-3";

            Papa.parse(file, {
                header: true,
                skipEmptyLines: true,
                complete: async function(results) {
                    const data = results.data;
                    const total = data.length;
                    
                    if (total === 0) {
                        alert("File CSV kosong.");
                        resetBulkUI(); return;
                    }

                    let successCount = 0;
                    logMessage.textContent = "Sedang memproses... JANGAN TUTUP HALAMAN!";

                    for (let i = 0; i < total; i++) {
                        const row = data[i];
                        const nisn = row.nisn ? row.nisn.toString().trim() : "";
                        const nama = row.nama ? row.nama.toString().trim().toUpperCase() : "";
                        const role = row.role ? row.role.toString().trim() : "Siswa";

                        if (nisn && nama) {
                            try {
                                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'voters_list', nisn);
                                await setDoc(docRef, { name: nama, role: role }, { merge: true }); // Pakai merge agar aman
                                successCount++;
                            } catch (err) {
                                console.error(`Gagal NISN ${nisn}:`, err);
                            }
                        }

                        // Update loading bar
                        const percent = Math.round(((i + 1) / total) * 100);
                        progressBar.style.width = `${percent}%`;
                        progressText.textContent = `${i + 1} / ${total}`;
                    }

                    logMessage.textContent = "Selesai!";
                    logMessage.className = "text-xs text-center font-bold text-green-600 mt-3";
                    alert(`Upload Massal Selesai!\nBerhasil: ${successCount} dari ${total} baris.`);
                    resetBulkUI(true);
                },
                error: function(err) {
                    alert("Gagal membaca file: " + err.message);
                    resetBulkUI();
                }
            });
        });

        function resetBulkUI(success = false) {
            btnUpload.disabled = false;
            fileInput.disabled = false;
            if (!success) statusArea.classList.add('hidden');
            fileInput.value = '';
        }

        // --- STREAMING_CHUNK:Menambahkan logika input manual... ---
        // --- LOGIKA TAMBAH/EDIT MANUAL ---
        const formManual = document.getElementById('form-manual');
        const manualId = document.getElementById('manual-id');
        const manualName = document.getElementById('manual-name');
        const manualRole = document.getElementById('manual-role');
        const btnManualSubmit = document.getElementById('btn-manual-submit');
        const manualAlert = document.getElementById('manual-alert');

        formManual.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const nisn = manualId.value.trim();
            const nama = manualName.value.trim().toUpperCase();
            const role = manualRole.value;

            btnManualSubmit.disabled = true;
            btnManualSubmit.innerHTML = `<div class="w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></div> Menyimpan...`;

            try {
                // Menyimpan data ke Firebase. 
                // Jika NISN sudah ada -> data lama ditimpa (Update).
                // Jika NISN belum ada -> membuat data baru (Insert).
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'voters_list', nisn);
                await setDoc(docRef, { name: nama, role: role }, { merge: true });

                // Tampilkan pesan sukses
                manualAlert.classList.remove('hidden', 'bg-red-100', 'text-red-700');
                manualAlert.classList.add('bg-green-100', 'text-green-700');
                manualAlert.innerHTML = `<i class="ph-fill ph-check-circle mr-1"></i> Data <strong>${nama}</strong> (${nisn}) berhasil disimpan!`;
                
                // Reset form
                formManual.reset();

            } catch (error) {
                console.error(error);
                manualAlert.classList.remove('hidden', 'bg-green-100', 'text-green-700');
                manualAlert.classList.add('bg-red-100', 'text-red-700');
                manualAlert.innerHTML = `<i class="ph-fill ph-x-circle mr-1"></i> Gagal menyimpan. Periksa koneksi internet Anda.`;
            } finally {
                btnManualSubmit.disabled = false;
                btnManualSubmit.innerHTML = `<i class="ph-bold ph-floppy-disk text-lg"></i> Simpan Data Pemilih`;
                
                // Hilangkan notifikasi setelah 5 detik
                setTimeout(() => {
                    manualAlert.classList.add('hidden');
                }, 5000);
            }
        });

    </script>
</body>
</html>
